# Produção simples: Postgres + app numa única máquina.
# Uso: cp .env.prod.example .env  (edite as senhas)  e  docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: univille
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: univille_eventos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U univille -d univille_eventos"]
      interval: 3s
      retries: 30
    # Sem porta exposta: o banco só é acessível pela app.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:3333"
    environment:
      DATABASE_URL: postgresql://univille:${POSTGRES_PASSWORD}@db:5432/univille_eventos?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      NODE_ENV: production
      PORT: 3333
      # Sem HTTPS o navegador não guarda cookie "Secure". Mude para true se colocar HTTPS na frente.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # No Wi-Fi da faculdade todos saem pelo mesmo IP: o limite por IP fica desligado,
      # o por conta continua (5 erros bloqueiam aquela conta por 5 min).
      LOGIN_MAX_POR_IP: ${LOGIN_MAX_POR_IP:-0}
      LOGIN_MAX_POR_CONTA: ${LOGIN_MAX_POR_CONTA:-5}
      LOGIN_JANELA_MIN: ${LOGIN_JANELA_MIN:-5}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}

volumes:
  pgdata:
